name: app_xem_phim
description: "Ứng dụng xem phim và ngắm ảnh CineFrame"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icon mặc định iOS/Material
  cupertino_icons: ^1.0.8

  # --- CÁC THƯ VIỆN FIREBASE ---
  firebase_core: ^3.10.0 # Khởi tạo kết nối Firebase
  firebase_auth: ^5.4.0 # Đăng nhập & Đăng ký tài khoản
  cloud_firestore: ^5.6.0 # Lấy thông tin User (Role) & Link Media động

  # --- THƯ VIỆN HIỂN THỊ PHIM & CÁC TRANG WEB ---
  flutter_inappwebview: ^6.1.5 # Trình duyệt WebView mạnh mẽ tích hợp AdBlock & Chống chặn DNS
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Khai báo hình ảnh trong ứng dụng (Đã di chuyển về đúng mục flutter)
  assets:
    - assets/icons/welcome_screen.png
