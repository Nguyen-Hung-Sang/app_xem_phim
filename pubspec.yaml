name: app_xem_phim
description: "Ứng dụng xem phim và ngắm ảnh"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icon mặc định iOS/Material
  cupertino_icons: ^1.0.8

  # --- CÁC THƯ VIỆN FIREBASE ---
  firebase_core: ^3.10.0 # Khởi tạo kết nối Firebase
  firebase_auth: ^5.4.0 # Đăng nhập & Đăng ký tài khoản
  cloud_firestore: ^5.6.0 # Lấy thông tin User (Role) & Link Media động

  # --- THƯ VIỆN LƯU BỘ NHỚ VÀ XEM PHIM ---
  flutter_inappwebview: ^6.1.5 # Trình duyệt WebView
  shared_preferences: ^2.5.5 # Lưu nhớ mật khẩu & trạng thái đăng nhập

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # Bổ sung thư viện tự động tạo Icon app

# Cấu hình đường dẫn Icon cho ứng dụng
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121218" # Màu nền tối trùng với giao diện app (hoặc "#000000")
  adaptive_icon_foreground: "assets/icons/Icon.png"

flutter:
  uses-material-design: true

  # Khai báo thư mục chứa hình ảnh/icon trong ứng dụng
  assets:
    - assets/icons/
